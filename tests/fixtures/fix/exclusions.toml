php-version = "8.4"

[source]
paths = ["src"]
excludes = ["src/source_excluded.php"]

[linter]
excludes = ["src/lint_excluded.php"]

[linter.rules]
no-is-null = { enabled = true }
yoda-conditions = { enabled = true, mode = "deny" }
missing-docs = { enabled = false }

[formatter]
excludes = ["src/format_excluded.php"]

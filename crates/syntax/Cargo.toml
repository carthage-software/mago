[package]
name = "mago-syntax"
description = "A correct, fast, and memory-efficient PHP syntax implementation, including Lexer, Parser, AST/CST, and utilities for Mago."
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
mago-syntax-core = { workspace = true }
mago-span = { workspace = true }
mago-reporting = { workspace = true }
mago-database = { workspace = true }
mago-php-version = { workspace = true }
serde = { workspace = true, optional = true }
strum = { workspace = true }
paste = { workspace = true }
ordered-float = { workspace = true, features = ["rand"] }
mago-allocator = { workspace = true }
memchr = { workspace = true }

[features]
default = []
serde = [
    "dep:serde",
    "ordered-float/serde",
    "mago-syntax-core/serde",
    "mago-span/serde",
]

[dev-dependencies]
pretty_assertions = { workspace = true }
criterion = { workspace = true }
tree-sitter = "0.27"
tree-sitter-php = "0.25"

[[bench]]
name = "parser"
harness = false
